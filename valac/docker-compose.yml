volumes:
  ollama_models:
  postgres_data:

services:
  # space to
  # avoid that popup
  react:
    build:
      context: ./react
    container_name: react
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    networks:
      - valac-net
    volumes:
      - ./react:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    command: [ "npm", "run", "dev" ]
  python-backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: python-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend-python:/app
    environment:
      - PYTHONUNBUFFERED=1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=${OLLAMA_HOST}
      - DATABASE_URL=postgresql://valac:valac@postgres:5432/valac
    restart: no
    networks:
      - valac-net
    depends_on:
      # ollama:
      #   condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
  searxng:
    image: searxng/searxng
    ports:
      - "8080:8080"
    networks:
      - valac-net
    environment:
      - SEARXNG_SECRET_KEY=pumblechoock
    volumes:
      - ./searxng:/etc/searxng
  # commented out because we use a host ollama for faster dev
  # change .env and uncomment this to switch to container (and slower) LLM responses
  # ollama:
  #   build:
  #     context: ./ollama
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   environment:
  #     - OLLAMA_LISTEN=0.0.0.0:11434
  #   volumes:
  #     - ./data/ollama:/root/.ollama
  #   networks:
  #     - valac-net
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API (optional)
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - valac-net
    environment:
      QDRANT_LOGLEVEL: debug

  postgres:
    image: postgres:16-alpine
    container_name: valac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: valac
      POSTGRES_PASSWORD: valac
      POSTGRES_DB: valac
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - valac-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U valac" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  valac-net:
    name: valac-net
    driver: bridge
